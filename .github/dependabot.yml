version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:00"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: github.com/charmbracelet/lipgloss/v2
        versions:
          - v2.0.0-beta1
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:00"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:00"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "pip"
    directory: "/www"
    schedule:
      interval: "daily"
      time: "08:00"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: npm
    directory: /internal/packagejson/testdata
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /internal/pipe/docker/testdata
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /internal/pipe/docker/v2/testdata
    schedule:
      interval: daily

  - package-ecosystem: gomod
    directory: /internal/pipe/ko/testdata/app
    schedule:
      interval: daily

  - package-ecosystem: gomod
    directory: /internal/pipe/universalbinary/testdata/fake
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /www
    schedule:
      interval: daily
